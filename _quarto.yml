  description: "Statistician and data scientist. PhD in Statistics, UBC Okanagan."
  site-url: https://chunleige.github.io
  favicon: images/favicon.ico
  open-graph: true
  page-navigation: false
  back-to-top-navigation: true

  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: portfolio.qmd
        text: Portfolio
      - href: publications.qmd
        text: Publications
      - href: talks.qmd
        text: Talks
      - href: cv.qmd
